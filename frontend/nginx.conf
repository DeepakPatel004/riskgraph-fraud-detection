worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream backend_api {
        zone backend_api 64k;
        server backend:8000 resolve;
    }
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_next_upstream off;
        # Preserve the existing browser client's /backend prefix convention.
        location /backend/ { proxy_pass http://backend_api/; }
        location /api/ { proxy_pass http://backend_api; }
        location = /health { proxy_pass http://backend_api/health; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
